[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-video-clipping"
version = "2.0.0"
description = "Unified AI Video Processing Environment and Autonomous Agent Skill"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "faster-whisper>=1.0.0",
    "ctranslate2>=4.0.0",
    "onnxruntime>=1.17.0",
    "opencv-python>=4.9.0",
    "yt-dlp>=2026.10.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
clip-studio = "cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
